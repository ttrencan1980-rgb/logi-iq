<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logi IQ Sklad">
<title>Logi IQ Sklad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikona-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hlavicka">
  <span class="logo">Logi <span>IQ</span> <small>sklad</small></span>
  <div id="hlavicka-info" class="hlavicka-info"></div>
</header>

<main id="obsah" class="obsah" aria-live="polite"></main>

<section id="dok" class="dok" aria-label="Skener" hidden>
  <video id="kamera" muted playsinline hidden></video>
  <p id="dok-text" class="dok-text"></p>
  <form data-form="kod" class="dok-riadok">
    <label for="kod" class="skryte">Kód alebo čiarový kód</label>
    <input id="kod" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Čítačka alebo kód">
    <button type="submit">OK</button>
    <button type="button" id="kamera-btn" class="kamera-btn">Zapnúť kameru</button>
  </form>
  <div id="ukazky" class="ukazky"></div>
</section>

<nav id="lista" class="lista" aria-label="Hlavné menu" hidden>
  <button data-obr="ulohy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Úlohy</button>
  <button data-obr="hladat"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Hľadať</button>
  <button data-obr="odhlas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Odhlásiť</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
